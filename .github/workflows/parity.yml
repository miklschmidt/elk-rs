name: Parity

on:
  workflow_dispatch:
    inputs:
      recursive_scenario_profile:
        description: "Recursive layout scenario profile (quick|default|full)"
        required: false
        default: "default"
      recursive_runtime_budget_gate:
        description: "Fail when recursive scenario avg_ms exceeds profile budget (true|false)"
        required: false
        default: "false"
      layered_issue_scenarios:
        description: "Layered issue scenario list"
        required: false
        default: "issue_405,issue_603,issue_680,issue_871,issue_905"
      layered_issue_iterations:
        description: "Layered issue scenario iterations"
        required: false
        default: "20"
      layered_issue_warmup:
        description: "Layered issue scenario warmup iterations"
        required: false
        default: "3"
      parity_compare_mode:
        description: "Perf comparison mode (window|baseline|both)"
        required: false
        default: "window"
      regression_threshold:
        description: "Regression threshold percent"
        required: false
        default: "5"
      regression_window:
        description: "Regression moving window size"
        required: false
        default: "3"
      regression_gate:
        description: "Fail workflow on regression (true|false)"
        required: false
        default: "false"
      java_compare_enabled:
        description: "Enable Java vs Rust layered issue compare (true|false)"
        required: false
        default: "true"
      java_compare_mode:
        description: "Java compare mode (results|baseline|both)"
        required: false
        default: "both"
      java_generate_enabled:
        description: "Generate Java layered issue CSV before compare (true|false)"
        required: false
        default: "true"
      java_parity_threshold:
        description: "Java parity regression threshold percent"
        required: false
        default: "0"
      java_parity_gate:
        description: "Fail workflow on Java parity regression (true|false)"
        required: false
        default: "true"
      java_baseline_parity_threshold:
        description: "Java baseline parity regression threshold percent"
        required: false
        default: "0"
      java_baseline_parity_gate:
        description: "Fail workflow on Java baseline parity regression (true|false)"
        required: false
        default: "true"

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The Java side builds and runs ELK from external/elk; the metadata checks read its sources.
      - name: Check out ELK
        run: git submodule update --init --depth 1 external/elk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # ELK's Maven/Tycho build downloads its Maven dependencies and Eclipse p2 repositories
      # into the local repository (p2 under .cache/tycho); keep them between runs.
      - uses: actions/cache@v4
        with:
          # ELK's own artifacts are rebuilt and installed on every run; do not keep stale ones.
          path: |
            ~/.m2/repository
            !~/.m2/repository/org/eclipse/elk
          key: parity-m2-${{ runner.os }}-${{ hashFiles('external/elk/**/pom.xml', 'external/elk/**/*.target') }}
          restore-keys: parity-m2-${{ runner.os }}-
      - uses: dtolnay/rust-toolchain@stable
      - name: Run parity scripts
        run: sh scripts/run_parity_all.sh
        env:
          COMMENT_COUNT: 2000
          COMMENT_ITERATIONS: 5
          COMMENT_WARMUP: 1
          COMMENT_OUTPUT: tests/results_comment_attachment.csv
          GRAPH_NODES: 1000
          GRAPH_EDGES: 2000
          GRAPH_ITERATIONS: 5
          GRAPH_WARMUP: 1
          GRAPH_MODE: both
          GRAPH_OUTPUT: tests/results_graph_validation.csv
          LAYOUT_NODES: 500
          LAYOUT_EDGES: 1000
          LAYOUT_ITERATIONS: 5
          LAYOUT_WARMUP: 1
          LAYOUT_ALGORITHM: fixed
          LAYOUT_VALIDATE_GRAPH: false
          LAYOUT_VALIDATE_OPTIONS: false
          LAYOUT_OUTPUT: tests/results_recursive_layout.csv
          RECURSIVE_SCENARIO_PROFILE: ${{ inputs.recursive_scenario_profile }}
          RECURSIVE_SCENARIOS: ""
          RECURSIVE_SCENARIO_ITERATIONS: 5
          RECURSIVE_SCENARIO_WARMUP: 1
          RECURSIVE_SCENARIO_OUTPUT: tests/results_recursive_layout_scenarios.csv
          LAYERED_ISSUE_SCENARIOS: ${{ inputs.layered_issue_scenarios }}
          LAYERED_ISSUE_ITERATIONS: ${{ inputs.layered_issue_iterations }}
          LAYERED_ISSUE_WARMUP: ${{ inputs.layered_issue_warmup }}
          LAYERED_ISSUE_OUTPUT: tests/results_layered_issue_scenarios.csv
      - name: Compare parity results
        run: sh scripts/compare_parity_results.sh "${{ inputs.regression_window }}" | tee tests/compare.txt
        env:
          PARITY_COMPARE_MODE: ${{ inputs.parity_compare_mode }}
          PARITY_BASELINE_LAYERED_FILE: tests/baselines/layered_issue_scenarios.csv
          PARITY_BASELINE_RECURSIVE_SCENARIOS_FILE: tests/baselines/recursive_layout_scenarios.csv
      - name: Check recursive runtime budget
        if: ${{ inputs.recursive_runtime_budget_gate == 'true' }}
        run: sh scripts/check_recursive_parity_runtime_budget.sh "tests/results_recursive_layout_scenarios.csv" "${{ inputs.recursive_scenario_profile }}" tests/recursive_runtime_budget.md
        env:
          RECURSIVE_RUNTIME_BUDGET_STRICT: "true"
          RECURSIVE_BUDGET_MS_QUICK: 40
          RECURSIVE_BUDGET_MS_DEFAULT: 60
          RECURSIVE_BUDGET_MS_FULL: 120
      - name: Check regression gate
        if: ${{ inputs.regression_gate == 'true' }}
        run: sh scripts/check_parity_regression.sh "${{ inputs.regression_threshold }}" "${{ inputs.regression_window }}"
        env:
          PARITY_COMPARE_MODE: ${{ inputs.parity_compare_mode }}
          PARITY_BASELINE_LAYERED_FILE: tests/baselines/layered_issue_scenarios.csv
          PARITY_BASELINE_RECURSIVE_SCENARIOS_FILE: tests/baselines/recursive_layout_scenarios.csv
      - name: Run Java compare pipeline
        if: ${{ inputs.java_compare_enabled == 'true' }}
        run: sh scripts/run_parity_and_compare_java.sh "tests/java_results_layered_issue_scenarios.csv" "${{ inputs.regression_window }}" "${{ inputs.java_parity_threshold }}" tests/java_vs_rust.md
        env:
          LAYERED_ISSUE_SKIP_RUST_RUN: "true"
          LAYERED_ISSUE_OUTPUT: tests/results_layered_issue_scenarios.csv
          LAYERED_ISSUE_SCENARIOS: ${{ inputs.layered_issue_scenarios }}
          LAYERED_ISSUE_ITERATIONS: ${{ inputs.layered_issue_iterations }}
          LAYERED_ISSUE_WARMUP: ${{ inputs.layered_issue_warmup }}
          JAVA_PARITY_COMPARE_MODE: ${{ inputs.java_compare_mode }}
          JAVA_PARITY_GENERATE: ${{ inputs.java_generate_enabled }}
          JAVA_PARITY_DRY_RUN: false
          JAVA_PARITY_ALLOW_GENERATE_FAILURE: false
          JAVA_PARITY_RETRIES: 0
          JAVA_PARITY_RETRY_DELAY_SECS: 3
          JAVA_PARITY_SKIP_DNS_CHECK: false
          JAVA_PARITY_REQUIRED_HOSTS: repo.eclipse.org,repo.maven.apache.org
          JAVA_PARITY_SCENARIOS: ${{ inputs.layered_issue_scenarios }}
          JAVA_PARITY_ITERATIONS: ${{ inputs.layered_issue_iterations }}
          JAVA_PARITY_WARMUP: ${{ inputs.layered_issue_warmup }}
          JAVA_PARITY_OUTPUT: tests/java_results_layered_issue_scenarios.csv
          JAVA_PARITY_EXTERNAL_ELK_ROOT: ${{ github.workspace }}/external/elk
          # Build in the checkout itself: it is thrown away with the runner, and the metadata checks
          # below read the Java sources this build generates into external/elk (src-gen).
          JAVA_PARITY_EXTERNAL_ISOLATE: "false"
          JAVA_PARITY_EXTERNAL_WORKTREE_ROOT: ${{ runner.temp }}
          # The repository the cache step restores; each hosted runner is a fresh machine.
          JAVA_PARITY_MVN_LOCAL_REPO: /home/runner/.m2/repository
          # Log the build, not every artifact and p2 download.
          JAVA_PARITY_MVN_ARGS: --batch-mode --no-transfer-progress
          JAVA_RESULTS_PARITY_GATE: ${{ inputs.java_parity_gate }}
          JAVA_BASELINE_FILE: tests/baselines/java_layered_issue_scenarios.csv
          JAVA_BASELINE_OUTPUT: tests/java_vs_rust_baseline.md
          JAVA_BASELINE_THRESHOLD: ${{ inputs.java_baseline_parity_threshold }}
          JAVA_BASELINE_PARITY_GATE: ${{ inputs.java_baseline_parity_gate }}
          JAVA_ARTIFACT_MIN_ROWS: 1
          JAVA_ARTIFACT_REQUIRED_SCENARIOS: ${{ inputs.layered_issue_scenarios }}
          JAVA_PARITY_SCENARIO_THRESHOLDS_FILE: tests/java_parity_thresholds.csv
          JAVA_PARITY_VERIFY_ARTIFACTS: "true"
      - name: Export Java baseline candidate
        if: ${{ inputs.java_compare_enabled == 'true' }}
        run: sh scripts/export_java_baseline_candidate.sh "tests/java_results_layered_issue_scenarios.csv" "tests/baselines/java_layered_issue_scenarios.candidate.csv" tests/java_baseline_candidate_status.md
        env:
          JAVA_CANDIDATE_MIN_ROWS: 1
          JAVA_CANDIDATE_REQUIRED_SCENARIOS: ${{ inputs.layered_issue_scenarios }}
          JAVA_CANDIDATE_STRICT: true
      - name: Check Java baseline candidate readiness
        if: ${{ inputs.java_compare_enabled == 'true' }}
        run: sh scripts/check_java_baseline_candidate.sh "tests/baselines/java_layered_issue_scenarios.candidate.csv" "tests/results_layered_issue_scenarios.csv" "${{ inputs.regression_window }}" "${{ inputs.java_parity_threshold }}" tests/java_baseline_candidate_check.md
        env:
          JAVA_CANDIDATE_MIN_ROWS: 1
          JAVA_CANDIDATE_REQUIRED_SCENARIOS: ${{ inputs.layered_issue_scenarios }}
          JAVA_CANDIDATE_REQUIRE_PARITY: "true"
          JAVA_CANDIDATE_STRICT: true
          JAVA_CANDIDATE_PARITY_THRESHOLDS_FILE: tests/java_parity_thresholds.csv
          TARGET_BASELINE: tests/baselines/java_layered_issue_scenarios.csv
      - name: Summarize Java parity status
        if: ${{ inputs.java_compare_enabled == 'true' }}
        run: sh scripts/summarize_java_parity_status.sh tests/java_vs_rust.md tests/java_vs_rust_baseline.md "tests/java_results_layered_issue_scenarios.csv" "tests/baselines/java_layered_issue_scenarios.csv" tests/java_parity_status.md
        env:
          RUST_RESULTS_FILE: tests/results_layered_issue_scenarios.csv
          JAVA_BASELINE_CANDIDATE_FILE: tests/baselines/java_layered_issue_scenarios.candidate.csv
          JAVA_BASELINE_CANDIDATE_REPORT: tests/java_baseline_candidate_status.md
          JAVA_BASELINE_CANDIDATE_CHECK_REPORT: tests/java_baseline_candidate_check.md
      - name: Suggest Java parity thresholds
        if: ${{ inputs.java_compare_enabled == 'true' }}
        run: sh scripts/suggest_java_parity_thresholds.sh "tests/results_layered_issue_scenarios.csv" "tests/java_results_layered_issue_scenarios.csv" "${{ inputs.regression_window }}" 2 tests/java_parity_thresholds.suggested.csv
      - name: Summarize parity results
        run: sh scripts/summarize_parity_results.sh
      # The metadata checks compare with ELK's generated Java sources, which only the Java
      # compare pipeline's Maven build produces.
      - name: Check CoreOptions parity
        if: ${{ inputs.java_compare_enabled == 'true' }}
        run: sh scripts/check_core_options_parity.sh
      - name: Check Core option dependency parity
        if: ${{ inputs.java_compare_enabled == 'true' }}
        run: sh scripts/check_core_option_dependency_parity.sh
      - name: Check algorithm ID parity
        if: ${{ inputs.java_compare_enabled == 'true' }}
        run: sh scripts/check_algorithm_id_parity.sh
      - name: Check algorithm category parity
        if: ${{ inputs.java_compare_enabled == 'true' }}
        run: sh scripts/check_algorithm_category_parity.sh
      - name: Check algorithm name parity
        if: ${{ inputs.java_compare_enabled == 'true' }}
        run: sh scripts/check_algorithm_name_parity.sh
      - name: Check algorithm description parity
        if: ${{ inputs.java_compare_enabled == 'true' }}
        run: sh scripts/check_algorithm_description_parity.sh
      - name: Check algorithm option support parity
        if: ${{ inputs.java_compare_enabled == 'true' }}
        run: sh scripts/check_algorithm_option_support_parity.sh
      - name: Check algorithm option default parity
        if: ${{ inputs.java_compare_enabled == 'true' }}
        run: sh scripts/check_algorithm_option_default_parity.sh
      - name: Check algorithm option default value parity
        if: ${{ inputs.java_compare_enabled == 'true' }}
        run: sh scripts/check_algorithm_option_default_value_parity.sh
      - name: Check algorithm feature parity
        if: ${{ inputs.java_compare_enabled == 'true' }}
        run: sh scripts/check_algorithm_feature_parity.sh
      - name: Check algorithm metadata parity
        if: ${{ inputs.java_compare_enabled == 'true' }}
        run: sh scripts/check_algorithm_metadata_parity.sh
      - name: Check layered phase wiring parity
        run: sh scripts/check_layered_phase_wiring_parity.sh
      - name: Upload parity artifacts
        uses: actions/upload-artifact@v4
        with:
          name: parity-results
          path: |
            tests/*.csv
            tests/compare.txt
            tests/recursive_runtime_budget.md
            tests/java_vs_rust.md
            tests/java_vs_rust_baseline.md
            tests/java_parity_status.md
            tests/java_baseline_candidate_status.md
            tests/java_baseline_candidate_check.md
            tests/core_options_parity.md
            tests/core_option_dependency_parity.md
            tests/algorithm_id_parity.md
            tests/algorithm_category_parity.md
            tests/algorithm_name_parity.md
            tests/algorithm_description_parity.md
            tests/algorithm_option_support_parity.md
            tests/algorithm_option_default_parity.md
            tests/algorithm_option_default_value_parity.md
            tests/algorithm_feature_parity.md
            tests/algorithm_metadata_parity.md
            tests/layered_phase_wiring_parity.md
            tests/layered_phase_wiring/*.tsv
            tests/summary.md
            tests/baselines/*.csv
