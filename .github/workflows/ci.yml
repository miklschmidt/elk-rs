name: CI

on:
  push:
  pull_request:

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The Rust tests load ELK's example graphs and test models from these submodules.
      - name: Check out the ELK sources and models the tests read
        run: git submodule update --init --depth 1 external/elk external/elk-models
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run tests and clippy
        run: sh scripts/run_fast_checks.sh
